<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | Prajapati Business Solutions</title>
  <link rel="stylesheet" href="reset-password.css">
</head>
<body>
  <main class="reset-card">
    <h1>Set New Password</h1>
    <p>Enter your new admin password below.</p>

    <form id="reset-form">
      <label for="new-password">New Password</label>
      <input type="password" id="new-password" minlength="8" required>

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" minlength="8" required>

      <button type="submit" id="reset-button">Update Password</button>
      <p id="reset-message" role="status"></p>
    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
