
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Admin Login | Prajapati Business Solutions</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <div class="brand-mark">P</div>

      <h1>PRAJAPATI BUSINESS SOLUTIONS</h1>

      <p class="subtitle">Business Management Portal</p>
    </div>

    <p class="admin-label">Administrator Login</p>

    <form id="login-form">

      <label for="admin-email">Email Address</label>

      <input
        type="email"
        id="admin-email"
        placeholder="Enter your admin email"
        autocomplete="username"
        required
      >

      <label for="admin-password">Password</label>

      <input
        type="password"
        id="admin-password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="login-button">
        Login
      </button>

      <p id="login-error" role="alert" hidden></p>

    </form>

    <div class="footer">
      © 2026 Prajapati Business Solutions
    </div>

  </main>

  <script src="../assets/js/config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
